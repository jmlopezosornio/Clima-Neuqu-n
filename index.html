<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Clima · Neuquén Capital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="weather-card" aria-label="Clima actual en Neuquén Capital">
    <header>
      <h1>Neuquén Capital</h1>
      <p class="region">Neuquén · Argentina</p>
    </header>

    <section class="main-weather">
      <div class="weather-row">
        <div class="temperature">
          <span id="main-temp">--</span><span class="unit">°C</span>
        </div>
        <div id="weather-icon" class="weather-icon" aria-hidden="true">☁️</div>
      </div>
      <p id="weather-desc">Consultando clima…</p>
      <p id="temp-range">Mín. --° · Máx. --°</p>
    </section>

    <section class="comfort-card">
      <div>
        <span class="label">Humedad</span>
        <strong id="comfort-humidity">--%</strong>
      </div>
      <div>
        <span class="label">Sensación</span>
        <strong id="comfort-feels-like">--°C</strong>
      </div>
      <div>
        <span class="label">Viento</span>
        <strong id="comfort-wind">-- km/h</strong>
      </div>
    </section>
  </main>

  <div id="connection" class="connection"></div>
  <script src="script.js"></script>
</body>
</html>
